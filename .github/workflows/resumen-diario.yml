name: Resumen diario por correo

# Dispara POST /brief/send cada mañana: el backend reúne agenda, clima, salud y
# entrenamiento del día y los manda por correo COMO DATOS CRUDOS. De ese buzón los
# recoge la rutina de Claude Code que compone el correo diario, así que este workflow
# tiene que ejecutarse ANTES que esa rutina.
#
# El cron de GitHub Actions va en UTC y no admite zonas horarias, así que hay que
# ajustarlo a mano en los cambios de hora: 05:30 UTC son las 07:30 en Madrid en verano
# (CEST, UTC+2) y las 06:30 en invierno (CET, UTC+1).
#
# Hay TRES horas y no una porque el planificador de Actions no es de fiar para algo que
# tiene que llegar todos los días: se retrasa cuando GitHub está cargado (10-15 min es
# normal) y a veces se salta la ejecución sin avisar y sin dejar rastro — el 1 de agosto
# de 2026 este workflow no llegó a dispararse ni una sola vez. Los dos disparos de
# respaldo cubren ese caso.
#
# Que de los tres intentos salga UN solo correo no lo arregla el workflow: lo arregla el
# backend, que reserva el día en la tabla `brief_sends` antes de componer nada y
# contesta "omitido" si el correo de hoy ya salió. No quites uno sin el otro.
on:
  schedule:
    - cron: '30 5 * * *'    # 07:30 en Madrid (verano) — el bueno
    - cron: '15 6 * * *'    # respaldo si el anterior no llegó a dispararse
    - cron: '0 7 * * *'     # último respaldo
  workflow_dispatch:        # también a mano, para probarlo sin esperar a mañana

# Si un intento se solapa con el anterior, no mandes dos correos.
concurrency:
  group: resumen-diario
  cancel-in-progress: false

jobs:
  enviar:
    name: Enviar resumen
    runs-on: ubuntu-latest
    steps:
      - name: POST /brief/send
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          BRIEF_TOKEN: ${{ secrets.BRIEF_TOKEN }}
          # Los disparos a mano fuerzan el envío: si no, al haber salido ya el correo del
          # día el backend contestaría "omitido" y no habría nada que probar. Los
          # programados nunca fuerzan — son justo los que hay que deduplicar.
          # Comparación negada en vez de un ternario `A && '0' || '1'`: ese lo cuela la
          # cadena '0', que en las expresiones de Actions es CIERTA por ser no vacía.
          FORZAR: ${{ github.event_name != 'schedule' }}
        # --retry con --retry-connrefused y un max-time generoso porque la máquina de
        # Fly escala a cero: la primera petición del día paga el arranque en frío.
        # El token va por cabecera, no por query string, para que no acabe en los logs.
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$BRIEF_TOKEN" ]; then
            echo "Falta la variable BACKEND_URL o el secret BRIEF_TOKEN del repositorio." >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$BACKEND_URL/brief/send?forzar=$FORZAR" \
            -H "X-Auth-Token: $BRIEF_TOKEN" \
            --max-time 180 \
            --retry 3 --retry-delay 15 --retry-connrefused

name: Resumen diario por correo (red de seguridad)

# ESTE WORKFLOW YA NO ES EL DISPARADOR DEL CORREO. Lo es la señal de despertar
# (POST /despertar desde el iPhone), con el sondeo de Home Assistant (POST
# /ha/brief-tick) como reloj de respaldo a partir de BRIEF_HORA_TOPE.
#
# Por qué dejó de serlo: el cron de GitHub Actions se retrasa 10-15 min cuando la
# cola va cargada, así que el correo llegaba tarde y a una hora distinta cada día. Un
# disparador que no sabe decirte a qué hora va a disparar no sirve para algo que tiene
# que pasar "al despertarte".
#
# Lo que sí cubre: que se caiga la casa entera (Home Assistant apagado, router sin
# luz, móvil sin batería). En ese escenario nadie llama al backend y el correo no
# saldría. Por eso sigue aquí, disparando tarde y a ciegas.
#
# Que llegue tarde y de más es inofensivo: /brief/send pasa por la misma puerta
# idempotente que el resto (tabla brief_envios, una fila por día), así que si el
# correo ya salió esto responde "no hacía falta" y no manda nada.
#
# El cron va en UTC y no admite zonas horarias: 09:00 UTC son las 11:00 en Madrid en
# verano (CEST) y las 10:00 en invierno (CET). En los dos casos cae después de la hora
# tope por defecto (10:00 local), que es lo único que importa aquí.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:        # también a mano, para probarlo sin esperar a mañana

# Si un intento se solapa con el anterior, no mandes dos correos.
concurrency:
  group: resumen-diario
  cancel-in-progress: false

jobs:
  enviar:
    name: Enviar resumen si no ha salido ya
    runs-on: ubuntu-latest
    steps:
      - name: POST /brief/send
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          BRIEF_TOKEN: ${{ secrets.BRIEF_TOKEN }}
        # --retry con --retry-connrefused y un max-time generoso porque la máquina de
        # Fly escala a cero: la primera petición del día paga el arranque en frío.
        # El token va por cabecera, no por query string, para que no acabe en los logs.
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$BRIEF_TOKEN" ]; then
            echo "Falta la variable BACKEND_URL o el secret BRIEF_TOKEN del repositorio." >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$BACKEND_URL/brief/send" \
            -H "X-Auth-Token: $BRIEF_TOKEN" \
            --max-time 180 \
            --retry 3 --retry-delay 15 --retry-connrefused

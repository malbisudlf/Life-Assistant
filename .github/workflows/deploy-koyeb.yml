name: Deploy backend (Koyeb)

# Deploy manual del backend, igual que el de Fly al que sustituye: se lanza a
# mano desde Actions ("Run workflow") o por API, NUNCA al hacer push. Afecta a
# produccion real y esa regla no cambia con la plataforma.
#
# Antes de que esto sirva de nada hay que crear el servicio una vez a mano (ver
# `docs/MIGRACION_BACKEND.md`): este workflow solo redespliega uno que ya existe
# con la ultima imagen del repo, no lo crea ni le pone los secretos.
#
# Secrets de GitHub que necesita:
#   KOYEB_TOKEN     token de API de Koyeb (Organization settings -> API)
#   KOYEB_SERVICIO  "<app>/<servicio>", p. ej. "life-assistant/backend"
#   KOYEB_URL       URL publica del servicio, para la comprobacion final
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar el CLI de Koyeb
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      # `--wait` es lo que hace que el paso termine cuando el despliegue esta
      # sano y no cuando Koyeb acepta la orden. Sin el, el workflow sale en
      # verde con el backend a medio arrancar: el falso OK que te hace confiar
      # en un despliegue roto.
      - name: Redesplegar
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          SERVICIO: ${{ secrets.KOYEB_SERVICIO }}
        run: |
          if [ -z "$KOYEB_TOKEN" ] || [ -z "$SERVICIO" ]; then
            echo "Faltan los secrets KOYEB_TOKEN o KOYEB_SERVICIO." >&2
            echo "Sin ellos esto no despliega nada; ver docs/MIGRACION_BACKEND.md." >&2
            exit 1
          fi
          koyeb services redeploy "$SERVICIO" --wait --wait-timeout 10m

      # Que el despliegue este sano para Koyeb y que la API conteste como debe
      # son dos cosas distintas: un secreto mal pegado arranca el proceso igual
      # y rompe el login. Esto ultimo es lo que se comprueba aqui.
      - name: Comprobar que la API responde
        env:
          KOYEB_URL: ${{ secrets.KOYEB_URL }}
        run: |
          if [ -z "$KOYEB_URL" ]; then
            echo "Sin KOYEB_URL no se puede comprobar el despliegue." >&2
            exit 1
          fi
          python scripts/verificar_backend.py "$KOYEB_URL"

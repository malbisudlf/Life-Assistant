# El DNS del contenedor de la música (compose.yml lo monta en /etc/resolv.conf).
#
# Por TCP (use-vc), no por UDP: el 2026-11-18 caja perdía entre la mitad y nueve de cada
# diez respuestas DNS por UDP (por TCP, ninguna), y cada nombre tardaba unos 5 s en
# resolverse. librespot entraba en la cuenta, pero su canal de control (dealer/spclient)
# no llegaba a conectar, y Spotify enseñaba «Jarvis» conectando para siempre.
nameserver 1.1.1.1
nameserver 8.8.8.8
options use-vc timeout:3 attempts:2
